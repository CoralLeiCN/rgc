name: Validate data contracts and documentation

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check documentation maintenance
        env:
          DOCUMENTATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$DOCUMENTATION_BASE" ] || [ "$DOCUMENTATION_BASE" = "0000000000000000000000000000000000000000" ]; then
            python3 -B scripts/check_documentation.py --structural-only
          else
            python3 -B scripts/check_documentation.py --base "$DOCUMENTATION_BASE"
          fi
      - name: Test data layers and modeling contracts
        run: |
          python3 -B scripts/fetch_contracts.py --all
          python3 -B -m unittest discover -s scripts/tests -v
          python3 -B -m unittest discover -s plugins/category-research/tests -v
          python3 -B -m unittest discover -s plugins/category-processing/tests -v
